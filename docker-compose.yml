services:
  db:
    image: postgres:15-alpine
    container_name: lab2_db
    env_file:
      - .env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  init-db:
    build:
      context: .
      dockerfile: init_db_dockerfile
    container_name: init_database
    depends_on:
      - db
    user:
      "0"
    environment:
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - app_net
    restart: "no"
  
  app:
    image: container_app
    build:
      context: .
      dockerfile: good_Dockerfile
    container_name: lab2_app
    depends_on:
      - db
      - init-db
    ports:
      - "${APP_PORT}:5000"
    volumes:
      - app_data:/app/data
    env_file:
      - .env
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app_data:
  db_data:

networks:
  app_net:
    driver: bridge