apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels:
    app: lab2-app
    component: application
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab2-app
      component: application
  template:
    metadata:
      labels:
        app: lab2-app
        component: application
        environment: production
    spec:
      initContainers:
      - name: init-db
        image: container_app:init
        envFrom:
        - configMapRef:
            name: app-configmap
        - secretRef:
            name: app-secret
      containers:
      - name: app-container
        image: container_app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: app-configmap
        - secretRef:
            name: app-secret
        volumeMounts:
        - name: app-data
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: app-data
        emptyDir: {}

